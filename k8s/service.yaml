apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: office-mgmt
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None

---

apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: office-mgmt
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 9001
  type: LoadBalancer
